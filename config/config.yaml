project_name: "PortfolioLab"

# Milestone 1: In-sample analysis
start_date: "2015-01-01"
end_date: null
trading_days_per_year: 252
risk_free_rate: 0.02
max_weight: 0.30
benchmark_ticker: "SPY"
data_mode: "canonical"
canonical_data_dir: "data/canonical"
asset_universe:
  - "SPY"
  - "QQQ"
  - "IWM"
  - "EFA"
  - "EEM"
  - "TLT"
  - "IEF"
  - "LQD"
  - "GLD"
  - "VNQ"

# Milestone 2: Walk-forward out-of-sample backtesting
backtest:
  enabled: true
  lookback_years: 3
  rebalance_frequency: "monthly"
  minimum_training_observations: 500
  holdout_start_date: "2018-01-01"  # Earliest rebalance date to allow 3-year lookback from 2015

# Milestone 3: Robust portfolio construction and turnover control
milestone3:
  enabled: true
  shrinkage:
    lambda_grid: [0.25, 0.50, 0.75]
    target_types: ["grand_mean", "zero"]
    default_lambda: 0.50
    default_target: "grand_mean"
  turnover:
    gamma_grid: [0.05, 0.10, 0.25]
    default_gamma: 0.10
    first_rebalance_convention: "equal_weight"
  transaction_costs:
    rates_bps: [0, 5, 10, 25]
    default_rate_bps: 10
  robust_strategies:
    - "Robust Maximum Sharpe"
    - "Turnover-Aware Maximum Sharpe"
    - "Robust Turnover-Aware Maximum Sharpe"
